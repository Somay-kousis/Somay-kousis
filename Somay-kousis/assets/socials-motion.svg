<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <style>
      @keyframes jiggle {
        0% { transform: rotate(-3deg) scale(1); }
        50% { transform: rotate(3deg) scale(1.1); }
        100% { transform: rotate(-3deg) scale(1); }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      @keyframes pop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      
      .bg { fill: url(#bg3); }
      .badge { 
        fill: #1e293b; 
        stroke: #38bdf8; 
        stroke-width: 2; 
        rx: 25;
      }
      
      /* Applying animations directly to the groups with center transform-origin */
      .github-group { transform-origin: 220px 75px; animation: jiggle 0.4s infinite; }
      .x-group { transform-origin: 400px 75px; animation: bounce 1s infinite; }
      .linkedin-group { transform-origin: 580px 75px; animation: jiggle 0.35s infinite reverse; }
      
      .badge-github { stroke: #f43f5e; }
      .badge-x { stroke: #a855f7; }
      .badge-linkedin { stroke: #4ade80; }
      
      .social-text { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
        font-size: 18px; 
        font-weight: bold; 
        fill: #f8fafc; 
        text-anchor: middle; 
      }
    </style>
  </defs>

  <rect width="800" height="150" class="bg" rx="10" />

  <g class="github-group">
    <g transform="translate(150, 50)">
      <rect width="140" height="50" class="badge badge-github" />
      <text x="70" y="32" class="social-text">GitHub</text>
    </g>
  </g>
  
  <g class="x-group">
    <g transform="translate(330, 50)">
      <rect width="140" height="50" class="badge badge-x" />
      <text x="70" y="32" class="social-text">𝕏 (Twitter)</text>
    </g>
  </g>
  
  <g class="linkedin-group">
    <g transform="translate(510, 50)">
      <rect width="140" height="50" class="badge badge-linkedin" />
      <text x="70" y="32" class="social-text">LinkedIn</text>
    </g>
  </g>
</svg>
