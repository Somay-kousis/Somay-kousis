<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <style>
      .bg-rect { fill: url(#bg); }
      @keyframes pop {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.05) translateY(-5px); }
      }
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(5px, -10px) rotate(2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-10px, 15px) rotate(-3deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .layer {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 72px;
        text-anchor: middle;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .layer-1 { fill: #f43f5e; transform: translate(4px, 4px); opacity: 0.6; }
      .layer-2 { fill: #8b5cf6; transform: translate(2px, 2px); opacity: 0.8; }
      .layer-3 { fill: #38bdf8; }
      
      .wrapper {
        animation: pop 4s ease-in-out infinite;
        transform-origin: center;
      }

      .shape1 { fill: #fb923c; opacity: 0.3; animation: float1 6s infinite; }
      .shape2 { fill: #4ade80; opacity: 0.2; animation: float2 7s infinite; }
      
      .subtitle {
        font-family: "Courier New", Courier, monospace;
        font-size: 20px;
        fill: #94a3b8;
        text-anchor: middle;
        letter-spacing: 1px;
      }
      
      .grid {
        stroke: #334155;
        stroke-width: 1;
        opacity: 0.3;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" class="bg-rect" rx="10" ry="10" />
  
  <!-- Grid for tech feel -->
  <g class="grid">
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200 M0,250 L800,250" />
    <path d="M100,0 L100,300 M200,0 L200,300 M300,0 L300,300 M400,0 L400,300 M500,0 L500,300 M600,0 L600,300 M700,0 L700,300" />
  </g>

  <!-- Floating shapes for 3D/meme randomness -->
  <rect x="50" y="50" width="40" height="40" rx="5" class="shape1" />
  <circle cx="700" cy="200" r="25" class="shape2" />
  <polygon points="100,250 120,280 80,280" class="shape1" />
  <rect x="650" y="80" width="30" height="30" transform="rotate(45, 665, 95)" class="shape2" />

  <g class="wrapper">
    <!-- 3D text stack -->
    <text x="400" y="160" class="layer layer-1">SOMAY KOUSIS</text>
    <text x="400" y="160" class="layer layer-2">SOMAY KOUSIS</text>
    <text x="400" y="160" class="layer layer-3">SOMAY KOUSIS</text>
    
    <!-- Typewriter style subtitle -->
    <text x="400" y="210" class="subtitle">BUILDING THE FUTURE OF THE WEB</text>
  </g>
</svg>
