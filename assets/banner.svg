    <circle cx="598" cy="92" r="0.7" opacity="0.18"><animate attributeName="opacity" values="0.18;0.58;0.18" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="115" r="1.1" opacity="0.32"><animate attributeName="opacity" values="0.32;0.82;0.32" dur="3.6s" repeatCount="indefinite"/></circle>
