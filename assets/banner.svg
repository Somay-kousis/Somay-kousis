    <circle cx="214" cy="19" r="1.4" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="41" r="0.9" opacity="0.25"><animate attributeName="opacity" values="0.25;0.65;0.25" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="478" cy="33" r="1.1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
