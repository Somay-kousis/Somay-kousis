    <circle cx="290" cy="268" r="1.3" opacity="0.38"><animate attributeName="opacity" values="0.38;0.9;0.38" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="411" cy="295" r="0.7" opacity="0.18"><animate attributeName="opacity" values="0.18;0.55;0.18" dur="6.3s" repeatCount="indefinite"/></circle>
