  <!-- Corner identity markers -->
  <text x="28" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="rgba(255,255,255,0.4)" text-transform="uppercase">SOMAY KOUSIS</text>
  <text x="28" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="rgba(255,255,255,0.25)">IDENTITY</text>

  <text x="872" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="2" fill="rgba(255,255,255,0.4)" text-anchor="end">GITHUB</text>
  <text x="872" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="2" fill="rgba(255,255,255,0.25)" text-anchor="end">PROFILE</text>

  <!-- THE MAIN EVENT: Giant bold name -->
  <text
    x="450"
    y="205"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="118"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-2"
  >SOMAY</text>

  <!-- Subtitle -->
  <text
    x="450"
    y="258"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    fill="rgba(255,255,255,0.45)"
    letter-spacing="8"
  >DESIGN  /  ENGINEERING</text>
</svg>
