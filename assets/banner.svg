    <circle cx="878" cy="31" r="0.8" opacity="0.2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="5.3s" repeatCount="indefinite"/></circle>

    <!-- Row 2 -->
    <circle cx="18" cy="95" r="1.0" opacity="0.22"><animate attributeName="opacity" values="0.22;0.68;0.22" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="85" cy="118" r="1.5" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/></circle>
