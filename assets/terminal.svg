<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="280" fill="#000000"/>

  <!-- Thin border -->
  <rect x="1" y="1" width="898" height="278" rx="0" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window bar -->
  <rect x="0" y="0" width="900" height="36" fill="rgba(255,255,255,0.03)"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="6" fill="#28C840"/>

  <!-- Window title -->
  <text x="450" y="23" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="1">somay@blink — zsh</text>

  <!-- PROMPT LINE + typewriter -->
  <text x="32" y="74" font-family="'Courier New', Courier, monospace" font-size="14" fill="rgba(255,255,255,0.5)">~</text>
  <text x="50" y="74" font-family="'Courier New', Courier, monospace" font-size="14" fill="rgba(255,255,255,0.25)"> % </text>
  <text x="76" y="74" font-family="'Courier New', Courier, monospace" font-size="14" fill="rgba(255,255,255,0.9)">
    cat about.txt
    <!-- Typewriter reveal mask -->
  </text>

  <!-- Typewriter mask over command -->
  <rect x="76" y="58" width="130" height="20" fill="#000">
    <animate attributeName="x" values="76;210;210;76" keyTimes="0;0.3;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="130;0;0;130" keyTimes="0;0.3;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Blinking cursor -->
  <rect x="76" y="61" width="8" height="14" fill="rgba(255,255,255,0.85)">
    <animate attributeName="x" values="76;210;210;76" keyTimes="0;0.3;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Output: fades in after typing -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.38;0.93;1" dur="6s" repeatCount="indefinite"/>

    <!-- About content in clean mono -->
    <text x="32" y="108" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.35)">──────────────────────────────────────────────────────────────────</text>

    <text x="32" y="136" font-family="'Courier New', Courier, monospace" font-size="13.5" fill="rgba(255,255,255,0.85)">  Frontend Developer  ·  ML Engineer  ·  ABV-IIITM Gwalior</text>

    <text x="32" y="162" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.45)">  Building things that feel alive. Human-first UI, models that think.</text>

    <text x="32" y="186" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.35)">──────────────────────────────────────────────────────────────────</text>

    <!-- Stats row -->
    <text x="32" y="214" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.5)">  ☕  Coffee  </text>
    <rect x="140" y="204" width="140" height="7" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="140" y="204" width="112" height="7" rx="3" fill="rgba(255,255,255,0.85)"/>
    <text x="290" y="214" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.35)">80%</text>

    <text x="355" y="214" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.5)">  💤  Sleep  </text>
    <rect x="460" y="204" width="140" height="7" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="460" y="204" width="28" height="7" rx="3" fill="rgba(255,255,255,0.85)"/>
    <text x="610" y="214" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.35)">20%</text>

    <text x="32" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.5)">  ⚡  Vibe  </text>
    <rect x="130" y="238" width="240" height="7" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="130" y="238" width="240" height="7" rx="3" fill="rgba(255,255,255,0.85)"/>
    <text x="378" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="rgba(255,255,255,0.35)">∞</text>
  </g>
</svg>
