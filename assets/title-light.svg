<svg xmlns="http://www.w3.org/2000/svg" width="607" height="128" viewBox="0 0 607 128" role="img" aria-label="Somay Kousis"><title>Somay Kousis</title><style>@font-face{font-family:'is';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'is',Georgia,'Times New Roman',serif;font-size:128px;transform-box:fill-box;}
.a{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards;}
.a1{animation-delay:.1s} .a2{animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.drop{opacity:0;transform-origin:50% 100%;animation:drop .55s cubic-bezier(.3,1.6,.5,1) .7s forwards;}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}60%{opacity:1}100%{opacity:1;transform:none}}
.tilt{opacity:0;transform-origin:50% 90%;animation:pop .4s ease-out 1.05s forwards, wob 5s ease-in-out 2s infinite;}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes wob{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(8deg)}92%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.a,.drop,.tilt{animation:none;opacity:1}}</style><text x="0.0" y="100" class="t a" style="animation-delay:0.050s" fill="#1f2328">S</text><text x="52.1" y="100" class="t a" style="animation-delay:0.095s" fill="#1f2328">o</text><text x="104.3" y="100" class="t a" style="animation-delay:0.140s" fill="#1f2328">m</text><text x="194.4" y="100" class="t a" style="animation-delay:0.185s" fill="#1f2328">a</text><text x="245.5" y="100" class="t a" style="animation-delay:0.230s" fill="#1f2328">y</text><text x="318.6" y="100" class="t a" style="animation-delay:0.320s" fill="#1f2328">K</text><text x="382.1" y="100" class="t a" style="animation-delay:0.365s" fill="#1f2328">o</text><text x="434.3" y="100" class="t a" style="animation-delay:0.410s" fill="#1f2328">u</text><text x="492.4" y="100" class="t a" style="animation-delay:0.455s" fill="#1f2328">s</text><text x="531.8" y="100" class="t a" style="animation-delay:0.500s" fill="#1f2328">i</text><text x="560.4" y="100" class="t a" style="animation-delay:0.545s" fill="#1f2328">s</text></svg>