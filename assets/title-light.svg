<svg xmlns="http://www.w3.org/2000/svg" width="318" height="140" viewBox="0 0 318 140" role="img" aria-label="ME!?"><title>ME!?</title><style>@font-face{font-family:'is';src:url(data:font/woff2;base64,) format('woff2');}
.t{font-family:'is',-apple-system,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:-2px;font-size:128px;transform-box:fill-box;}
.a{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards;}
.a1{animation-delay:.1s} .a2{animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.drop{opacity:0;transform-origin:50% 100%;animation:drop .55s cubic-bezier(.3,1.6,.5,1) .7s forwards;}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}60%{opacity:1}100%{opacity:1;transform:none}}
.tilt{opacity:0;transform-origin:50% 90%;animation:pop .4s ease-out 1.05s forwards, wob 5s ease-in-out 2s infinite;}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes wob{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(8deg)}92%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.a,.drop,.tilt{animation:none;opacity:1}}</style><text x="0.0" y="120" class="t a a1" fill="#1f2328">M</text><text x="118.1" y="120" class="t a a2" fill="#1f2328">E</text><text x="198.6" y="120" class="t drop" fill="#c93c37">!</text><text x="239.7" y="120" class="t tilt" fill="#c93c37">?</text></svg>