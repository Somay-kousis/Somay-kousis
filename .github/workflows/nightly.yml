name: nightly

# Redraw the stitched year and the merged counts from live GitHub data.
# Commits only when something changed.

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.68.0
      - run: python scripts/stitched_year.py
      - run: python scripts/counts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit --quiet -m "nightly: redraw the stitched year and counts"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
